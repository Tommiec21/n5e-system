# Publish the exact package verified by this repository's successful main-branch CI run.
name: Release
on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
permissions:
  contents: write
  actions: read
concurrency:
  group: n5e-release
  cancel-in-progress: false
jobs:
  release:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/download-artifact@v4
        with:
          name: verified-release
          path: dist
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Validate package and decide
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          VERSION="$(node -p "require('./system.json').version")"
          ASSET_VERSION="$(node -p "require('./dist/system.json').version")"
          test "$VERSION" = "$ASSET_VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          HEAD_SHA="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
          if [ "$SOURCE_SHA" != "$HEAD_SHA" ] || gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: softprops/action-gh-release@v2
        if: steps.v.outputs.publish == 'true'
        with:
          tag_name: v${{ steps.v.outputs.version }}
          target_commitish: ${{ github.event.workflow_run.head_sha }}
          name: v${{ steps.v.outputs.version }}
          files: |
            dist/system.json
            dist/n5e.zip
            dist/n5e-core.zip
          fail_on_unmatched_files: true
          prerelease: false
          make_latest: true
          generate_release_notes: true
