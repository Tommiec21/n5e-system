# Publishes a release whenever system.json's version on main has no matching v<version> tag yet.
# Bump the version (npm run release -- <version>), update CHANGELOG.md, push to main: done.
# Pushing a v* tag by hand still works too.
# Foundry checks .../releases/latest/download/system.json, so each release becomes the update
# players see.
name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version and decide
        id: v
        run: |
          VERSION="$(node -p "require('./system.json').version")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            if [ "${GITHUB_REF_NAME#v}" != "$VERSION" ]; then
              echo "Tag ${GITHUB_REF_NAME} does not match system.json version $VERSION"; exit 1
            fi
            echo "publish=true" >> "$GITHUB_OUTPUT"
          elif gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "Release v$VERSION already exists; nothing to publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - uses: actions/setup-node@v4
        if: steps.v.outputs.publish == 'true'
        with:
          node-version: 22
          cache: npm

      - if: steps.v.outputs.publish == 'true'
        run: npm ci

      - name: Build release
        if: steps.v.outputs.publish == 'true'
        run: npm run release
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Publish
        if: steps.v.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: v${{ steps.v.outputs.version }}
          files: |
            dist/system.json
            dist/n5e.zip
          # Never a GitHub "pre-release": .../releases/latest/ skips those, which would break
          # Foundry's update check. Alpha/beta status lives in the version number instead.
          prerelease: false
          make_latest: true
          generate_release_notes: true
